name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Hard rule 15: lib/calendar.ts is the only module allowed to do date
      # arithmetic. A UTC server doing its own anchors day 0 to the wrong day,
      # and the bug is invisible until a follow-up lands on a Saturday.
      - name: No date arithmetic outside the calendar module
        run: npm run check:dates

      # The suite runs under TZ=America/New_York (see package.json), so a
      # timezone assumption fails here rather than in a recipient's inbox.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # The seed is what week 1 ships as a working set; a malformed entry would
      # only surface when the founder ran the seeder by hand.
      - name: Validate the company seed
        run: |
          node -e "
            const rows = require('./seed/companies.json');
            if (!Array.isArray(rows) || rows.length < 30) {
              console.error('expected at least 30 seed companies, got', rows.length);
              process.exit(1);
            }
            const domains = new Set();
            for (const r of rows) {
              for (const field of ['name', 'domain', 'segment']) {
                if (!r[field]) { console.error('missing', field, 'on', r.name); process.exit(1); }
              }
              if (r.segment === 'free_zone_only') {
                console.error('free-zone-only entity in the seed:', r.name);
                process.exit(1);
              }
              if (domains.has(r.domain)) { console.error('duplicate domain:', r.domain); process.exit(1); }
              domains.add(r.domain);
            }
            console.log('seed ok:', rows.length, 'companies');
          "

      # A migration that cannot be applied from scratch is a migration that
      # cannot be recovered from a backup.
      - name: Migrate and seed a fresh database
        run: |
          DB_PATH=/tmp/ci.db npm run db:migrate
          DB_PATH=/tmp/ci.db npm run db:seed
          DB_PATH=/tmp/ci.db npm run db:seed
